name: TVRemote
options:
  bundleIdPrefix: co.slaven
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8SX4DK48U6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  TVRemote:
    type: application
    platform: iOS
    sources: [Sources/Shared, Sources/App]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - target: TVRemoteWidgets
      - target: TVRemoteWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.slaven.tvremote
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: TV Remote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TV Remote finds and controls the TVs on your Wi-Fi.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  TVRemoteWidgets:
    type: app-extension
    platform: iOS
    sources: [Sources/Shared, Sources/Widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.slaven.tvremote.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TV Remote
        SKIP_INSTALL: YES
  TVRemoteWatch:
    type: application
    platform: watchOS
    sources: [Sources/Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.slaven.tvremote.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TV Remote
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: co.slaven.tvremote
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES
